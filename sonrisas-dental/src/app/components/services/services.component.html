<section class="services" id="servicios">
  <div class="container">

    <div class="services__header">
      <span class="section-label">Lo que ofrecemos</span>
      <h2 class="section-title">Nuestros Servicios</h2>
      <p class="section-subtitle">
        Tratamientos modernos y personalizados para cuidar tu salud bucal en cada etapa de la vida.
      </p>
    </div>

    <div class="services__grid">
      @for (service of services; track service.title) {
        <article class="service-card" [style.--accent]="service.accent">
          <div class="service-card__icon-wrap">
            <span class="service-card__icon" role="img" [attr.aria-label]="service.title">
              {{ service.icon }}
            </span>
          </div>
          <h3 class="service-card__title">{{ service.title }}</h3>
          <p class="service-card__desc">{{ service.description }}</p>
          <span class="service-card__arrow" aria-hidden="true">→</span>
        </article>
      }
    </div>

  </div>
</section>
