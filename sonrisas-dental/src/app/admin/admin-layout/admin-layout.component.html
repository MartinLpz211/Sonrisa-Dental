<div class="admin-shell" [class.sidebar-open]="sidebarOpen()">
  <!-- Header superior -->
  <header class="admin-header">
    <button
      class="admin-header__burger"
      type="button"
      (click)="toggleSidebar()"
      aria-label="Abrir/cerrar menú"
    >
      <span></span><span></span><span></span>
    </button>

    <a routerLink="/admin" class="admin-header__brand">🦷 Sonrisas Dental</a>

    <div class="admin-header__actions">
      <button class="admin-header__icon-btn" type="button" aria-label="Notificaciones">
        🔔
        @if (notificationsCount() > 0) {
          <span class="admin-header__badge">{{ notificationsCount() }}</span>
        }
      </button>

      <div class="admin-header__user">
        <div class="admin-header__avatar">{{ initials }}</div>
        <span class="admin-header__name">{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>
      </div>

      <button class="admin-header__logout" type="button" (click)="logout()" title="Cerrar sesión">
        🚪
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <nav class="admin-sidebar__nav">
      @for (item of menuItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="admin-sidebar__link--active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="admin-sidebar__link"
          (click)="closeSidebarOnMobileNav()"
        >
          <span class="admin-sidebar__icon">{{ item.icon }}</span>
          <span class="admin-sidebar__label">{{ item.label }}</span>
        </a>
      }

      <button class="admin-sidebar__link admin-sidebar__link--logout" type="button" (click)="logout()">
        <span class="admin-sidebar__icon">🚪</span>
        <span class="admin-sidebar__label">Cerrar sesión</span>
      </button>
    </nav>
  </aside>

  <!-- Overlay para cerrar el sidebar al tocar fuera, en móvil -->
  <div class="admin-overlay" (click)="toggleSidebar()"></div>

  <!-- Contenido -->
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
